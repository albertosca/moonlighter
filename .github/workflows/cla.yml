name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/albertosca/moonlighter/blob/main/CLA.md'
          branch: 'main'
          allowlist: albertosca,bot*
          custom-notsigned-prcomment: 'Thanks for your contribution. Before this can be merged, please sign the [Contributor License Agreement](https://github.com/albertosca/moonlighter/blob/main/CLA.md) by commenting exactly:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
