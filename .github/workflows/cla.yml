name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # pull_request_target runs against the base repo with write perms; this workflow never
        # checks out or runs PR code, which is the only thing that makes that safe.
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Signatures live on their own branch: the main ruleset requires PRs and status
          # checks, which would reject the action's direct signature commits to main.
          path-to-signatures: 'signatures/version1/cla.json'
          # Pinned to the commit that last changed CLA.md's text, not a moving branch ref: any
          # future wording change to CLA.md must (1) update this SHA, (2) bump
          # path-to-signatures to a new signatures/versionN path, and (3) have existing signers
          # re-sign under the new version, per the adversarial CLA review (I3).
          path-to-document: 'https://github.com/albertosca/moonlighter/blob/c249a815684003bb69e9d7f5effabd950e732c4a/CLA.md'
          branch: 'cla-signatures'
          allowlist: albertosca,dependabot[bot],github-actions[bot],renovate[bot]
          custom-notsigned-prcomment: 'Thanks for your contribution. Before this can be merged, please sign the [Contributor License Agreement](https://github.com/albertosca/moonlighter/blob/main/CLA.md) by commenting exactly the sentence below.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
