name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Version lockstep check
        run: python scripts/check_version_lockstep.py

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: |
          uv run mypy \
            --package moonlighter.core \
            --package moonlighter.discovery \
            --package moonlighter.application \
            --package moonlighter.tracking \
            --package moonlighter.server \
            --package moonlighter.startup \
            --package moonlighter.views \
            --package moonlighter._tool_logging \
            --package moonlighter.init
          uv run mypy scripts/

      - name: Tests (unit, coverage gate 100%)
        run: uv run pytest -m "not e2e" --junitxml=test-report.xml

      - name: README facts and links
        run: uv run python scripts/check_readme_facts.py --junit test-report.xml

      - name: Docs EN/PT parity
        run: uv run python scripts/check_docs_parity.py

      - name: Docs site builds (strict)
        run: bash scripts/build_docs.sh

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Export the locked dependency set
        # --all-groups: without it the docs group (zensical and its deps) is never audited.
        run: uv export --no-hashes --frozen --all-extras --all-groups -o requirements.txt

      - name: Security audit (pip-audit against the lockfile)
        run: uv run --with pip-audit pip-audit --requirement requirements.txt
