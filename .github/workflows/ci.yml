name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Security audit (pip-audit against the lockfile)
        run: uv run --with pip-audit pip-audit --requirement <(uv export --no-hashes --frozen)

      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: |
          uv run mypy \
            --package gauntler.core \
            --package gauntler.discovery \
            --package gauntler.application \
            --package gauntler.tracking \
            --package gauntler.server \
            --package gauntler.startup \
            --package gauntler.views

      - name: Tests (unit, coverage gate 100%)
        run: uv run pytest -m "not e2e"
