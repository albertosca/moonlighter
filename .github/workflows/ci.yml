name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.6"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint and format check (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: |
          uv run mypy \
            --package moonlighter.core \
            --package moonlighter.discovery \
            --package moonlighter.application \
            --package moonlighter.tracking \
            --package moonlighter.server \
            --package moonlighter.startup \
            --package moonlighter.views \
            --package moonlighter._tool_logging \
            --package moonlighter.init

      - name: Tests (unit, coverage gate 100%)
        run: uv run pytest -m "not e2e"

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.6"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Export the locked dependency set
        run: uv export --no-hashes --frozen --all-extras -o requirements.txt

      - name: Security audit (pip-audit against the lockfile)
        run: uv run --with pip-audit pip-audit --requirement requirements.txt
