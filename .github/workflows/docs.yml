name: Docs

# Builds the bilingual site with revision dates and deploys it to GitHub Pages
# (enabled 2026-09-23 with build_type: workflow). The required CI job already builds
# the site on every PR, but without --stamp; a PR touching the stamping path runs this
# workflow's build (no deploy) so that path is exercised before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/docs.yml'
      - 'scripts/build_docs.sh'
      - 'scripts/stamp_revision_dates.py'
      - 'scripts/check_built_site.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: a shallow clone dates every page with the newest commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.6"
      - name: Build (stamped, checked)
        run: bash scripts/build_docs.sh --stamp
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
