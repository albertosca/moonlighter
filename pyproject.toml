[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-fail-under=100 -m 'not e2e'"
markers = [
    "e2e: testes end-to-end que exigem navegador real (rodar com -m e2e)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.coverage.run]
source_pkgs = [
    "gauntler.core",
    "gauntler.discovery",
    "gauntler.application",
    "gauntler.tracking",
    "gauntler.server",
    "gauntler.startup",
    "gauntler.views",
]
branch = true
omit = [
    "*/gauntler/core/browser.py",
    "*/gauntler/discovery/sources/playwright.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "peewee.*",
    "fastmcp.*",
    "mcp.*",
    "rich.*",
    "yaml.*",
    "httpx.*",
    "anthropic.*",
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true
