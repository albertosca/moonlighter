[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0",
    "playwright>=1.47",
    "peewee>=3.17",
    "anthropic>=0.40",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
candidatador = "candidatador.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
# RUF001-003: caracteres "ambíguos" são tipografia PT-BR intencional no output
# (en-dash em faixas salariais "$150–200k", ∗ de footnote). Não são bugs.
# E501: o `ruff format` já é dono do tamanho de linha do CÓDIGO (100); as linhas
# longas restantes são conteúdo de string (JS/CSS embutido, regex, prompts) que o
# formatter não toca e que picotar deixaria pior.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts inserem a raiz no sys.path ANTES de importar o pacote (E402 esperado).
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "peewee.*",
    "fastmcp.*",
    "mcp.*",
    "rich.*",
    "yaml.*",
    "httpx.*",
    "anthropic.*",
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true
