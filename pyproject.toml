[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "playwright>=1.47",
    "peewee>=3.17",
    "anthropic>=0.40",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.14"]

[project.scripts]
candidatador = "candidatador.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
