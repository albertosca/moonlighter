[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    # Upper bound is deliberate: ruff's formatter style changes between minor
    # versions, and an unbounded constraint silently re-drifts every file and
    # breaks CI's `ruff format --check`.
    # Dependabot proposes these bumps now (it moves this pin and the lock, but
    # never reformats). Before merging one, run `ruff format` at the new version:
    # if it rewrites anything, that reformat belongs in the SAME PR, so the style
    # change lands as one reviewable commit instead of surprising the next branch.
    # 0.15 -> 0.16.3 needed none, verified 2026-08-21.
    "ruff>=0.16.3,<0.17",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-fail-under=100 -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that require a real browser (run with -m e2e)",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
# S101 assert: pytest's normal idiom. S108 /tmp paths: test fixtures, not runtime.
# S105 hardcoded password: false positive on a mock dict key named "refresh_token".
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.coverage.run]
source_pkgs = [
    "moonlighter.core",
    "moonlighter.discovery",
    "moonlighter.application",
    "moonlighter.tracking",
    "moonlighter.server",
    "moonlighter.startup",
    "moonlighter.views",
    "moonlighter._tool_logging",
    "moonlighter.init",
]
branch = true
omit = [
    "*/moonlighter/core/browser.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "peewee.*",
    "fastmcp.*",
    "mcp.*",
    "rich.*",
    "yaml.*",
    "httpx.*",
    "anthropic.*",
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true
