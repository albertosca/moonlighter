[tool.moonlighter.file-length]
# A file past `limit` is a module doing more than one thing (scripts/check_file_length.py).
limit = 200
ceiling = 250

[tool.moonlighter.file-length.justified]

[tool.complexipy]
# Cognitive complexity per function: stricter than SonarQube's default (15) and
# wemake-python-styleguide's (12). Nesting costs more than branching, which is the point.
max-complexity-allowed = 10

[tool.coverage.run]
source_pkgs = [
    "moonlighter.core",
    "moonlighter.discovery",
    "moonlighter.application",
    "moonlighter.tracking",
    "moonlighter.server",
    "moonlighter.startup",
    "moonlighter.views",
    "moonlighter._tool_logging",
    "moonlighter.init",
]
branch = true
omit = [
    "*/moonlighter/core/browser.py",
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Beyond --strict: every overriding method says so (@override), every ignore names its
# code, and the checks that catch dead or always-true conditions are on.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    "deprecated",
    "exhaustive-match",
    "redundant-self",
]

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "peewee.*",
    "fastmcp.*",
    "mcp.*",
    "rich.*",
    "yaml.*",
    "httpx.*",
    "anthropic.*",
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true
