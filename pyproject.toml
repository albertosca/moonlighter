[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    # Upper bound is deliberate: ruff's formatter style changes between minor
    # versions, and an unbounded constraint silently re-drifts every file and
    # breaks CI's `ruff format --check`.
    # Dependabot proposes these bumps now (it moves this pin and the lock, but
    # never reformats). Before merging one, run `ruff format` at the new version:
    # if it rewrites anything, that reformat belongs in the SAME PR, so the style
    # change lands as one reviewable commit instead of surprising the next branch.
    # 0.15 -> 0.16.3 needed none, verified 2026-08-21.
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4.0",
    # Cognitive complexity gate (limit in [tool.complexipy]). Upper bound: a new major
    # may re-score functions, and that re-score should land as its own reviewed change.
    "complexipy>=8.3,<9",
]
# Docs site (guide/ → GitHub Pages). Deliberately no upper bound: uv.lock pins the
# exact version and a Dependabot bump lands only if the strict docs build passes.
# Zensical is pre-1.0 (0.0.64 on 2026-09-23) — try a bump locally before merging it:
#   uv run --group docs --with zensical==X zensical build --strict -f zensical.en.yml
docs = [
    "zensical",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov --cov-fail-under=100 -m 'not e2e'"
markers = [
    "e2e: end-to-end tests that need a real browser, pdflatex, or the network (run with -m e2e)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# PEP 420: the shared `moonlighter/` level has no __init__.py on purpose (see CLAUDE.md).
namespace-packages = [
    "packages/core/moonlighter",
    "packages/scan/moonlighter",
    "packages/apply/moonlighter",
    "packages/email/moonlighter",
    "packages/full/moonlighter",
]

[tool.ruff.lint]
# Every rule Ruff has. Each ignore below says why it doesn't fit this codebase.
select = ["ALL"]
ignore = [
    # mypy --strict is the type gate; ANN would only restate it.
    "ANN",
    # Ruff's own documentation: these two conflict with `ruff format`.
    "COM812", "ISC001",
    # Line length is the formatter's job; what it leaves long is prose inside strings.
    "E501",
    # Portuguese copy uses en dashes, curly quotes and accents on purpose.
    "RUF001", "RUF002", "RUF003",
    # Classes, methods and functions get a docstring when their name and types don't
    # already say it, never to satisfy a counter. Modules and packages always get one.
    "D101", "D102", "D103", "D105", "D106", "D107",
    # A message at the raise site reads better than a one-use exception subclass (TRY003)
    # or a throwaway variable (EM101, EM102); the traceback duplication they prevent is cosmetic.
    "TRY003", "EM101", "EM102",
    # Annotations are evaluated at runtime: FastMCP builds tool schemas from them and
    # dataclasses read them. Imports moved under TYPE_CHECKING would raise NameError there.
    "TC001", "TC002", "TC003",
    # The license (AGPL-3.0) is declared once, at the root and in each package's metadata.
    "CPY001",
    # Names are spelled in full here, parameters included: a classmethod's first
    # parameter says which class it receives (`scanner_class`, `model_class`), never `cls`.
    "N804",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-statements = 25
max-returns = 6
max-branches = 8

[tool.ruff.lint.flake8-builtins]
# A005 (a module named after a stdlib module) compares the path from the project root by
# default, so `core/http.py` would pass though it shadows `http`. Every module here sits
# inside a package: compare the last component, the gate behind the ban on stdlib names.
strict-checking = true

[tool.ruff.lint.per-file-ignores]
# Scripts are standalone executables run from the repository root: not a package
# (INP001), stdout is their interface (T201), and some fix sys.path first (E402).
"scripts/*" = ["E402", "INP001", "T201"]
# S101: assert is pytest's idiom. S105/S106: mock credentials such as "refresh_token".
# S108: /tmp paths in fixtures, never at runtime. PLR2004: a literal expected value is
# the point of an assertion. ARG: fakes must match the signature they replace, and
# fixtures requested for their side effect arrive as unused arguments.
# SLF001: unit tests pin the private helpers where a quirk lives.
# D: a test's name is its documentation.
"tests/*" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG001", "ARG002", "ARG005", "SLF001", "D"]

