<!DOCTYPE html>
<html>
<head><title>Lever Application</title></head>
<body>
<div class="application-form">
  <div class="application-label">Full Name</div>
  <label for="lever_name" class="application-label">Name</label>
  <input id="lever_name" type="text" name="name">

  <label for="lever_email" class="application-label">Email</label>
  <input id="lever_email" type="email" name="email">

  <input type="file" name="resume">
  <button class="template-btn-submit" type="submit">Submit</button>
</div>
<script>
  // Simula a confirmação do ATS: injeta o marcador de sucesso ao submeter.
  document.querySelector('.template-btn-submit').addEventListener('click', function (e) {
    e.preventDefault();
    document.body.insertAdjacentHTML('beforeend',
      '<div id="confirmation">Thank you for applying! We received your application.</div>');
  });
</script>
</body>
</html>
