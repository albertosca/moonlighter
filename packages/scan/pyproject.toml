[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador-scan"
version = "0.1.0"
description = "Job board scanning and LLM-based evaluation for candidatador"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alberto de Sá Cavalcanti de Albuquerque", email = "albertoalbuquerque01@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "candidatador-core>=0.1.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/albertosca/gauntler"
Repository = "https://github.com/albertosca/gauntler"
"Bug Tracker" = "https://github.com/albertosca/gauntler/issues"

[tool.hatch.build.targets.wheel]
packages = ["candidatador"]

[tool.uv.sources]
candidatador-core = { workspace = true }
