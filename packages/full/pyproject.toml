[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauntler-full"
version = "0.1.0"
description = "Full gauntler bundle — MCP server exposing all tools to Claude"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alberto de Sá Cavalcanti de Albuquerque", email = "albertoalbuquerque01@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "gauntler-core>=0.1.0",
    "gauntler-scan>=0.1.0",
    "gauntler-apply>=0.1.0",
    "gauntler-email>=0.1.0",
    "fastmcp>=2.0",
]

[project.scripts]
gauntler = "gauntler.server:main"

[project.urls]
Homepage = "https://github.com/albertosca/gauntler"
Repository = "https://github.com/albertosca/gauntler"
"Bug Tracker" = "https://github.com/albertosca/gauntler/issues"

[tool.hatch.build.targets.wheel]
packages = ["gauntler"]

[tool.uv.sources]
gauntler-core = { workspace = true }
gauntler-scan = { workspace = true }
gauntler-apply = { workspace = true }
gauntler-email = { workspace = true }
