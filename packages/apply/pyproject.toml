[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador-apply"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "candidatador-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["candidatador"]

[tool.uv.sources]
candidatador-core = { workspace = true }
