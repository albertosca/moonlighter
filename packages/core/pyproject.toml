[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonlighter-core"
version = "0.1.4"
description = "Storage, config, profile and the shared LLM client — the foundation slice of moonlighter"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alberto de Sá Cavalcanti de Albuquerque", email = "albertoalbuquerque01@gmail.com"}]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "peewee>=4.4.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]

[project.urls]
Homepage = "https://github.com/albertosca/moonlighter"
Repository = "https://github.com/albertosca/moonlighter"
"Bug Tracker" = "https://github.com/albertosca/moonlighter/issues"

[tool.hatch.build.targets.wheel]
packages = ["moonlighter"]
