[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gauntler-core"
version = "0.1.0"
description = "Core database, configuration, browser automation and LLM primitives for gauntler"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alberto de Sá Cavalcanti de Albuquerque", email = "albertoalbuquerque01@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "peewee>=3.17",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "playwright>=1.47",
]

[project.urls]
Homepage = "https://github.com/albertosca/gauntler"
Repository = "https://github.com/albertosca/gauntler"
"Bug Tracker" = "https://github.com/albertosca/gauntler/issues"

[tool.hatch.build.targets.wheel]
packages = ["gauntler"]
