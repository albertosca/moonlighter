[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "peewee>=3.17",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "playwright>=1.47",
]

[tool.hatch.build.targets.wheel]
packages = ["candidatador"]
