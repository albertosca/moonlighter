[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador-email"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "candidatador-core>=0.1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["candidatador"]

[tool.uv.sources]
candidatador-core = { workspace = true }
