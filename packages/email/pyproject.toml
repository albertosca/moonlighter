[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "candidatador-email"
version = "0.1.0"
description = "Gmail-based reply tracking and interview pipeline monitoring for candidatador"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Alberto de Sá Cavalcanti de Albuquerque", email = "albertoalbuquerque01@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "candidatador-core>=0.1.0",
    "google-api-python-client>=2.100",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.1",
]

[project.urls]
Homepage = "TODO_REPO_URL"
Repository = "TODO_REPO_URL"
"Bug Tracker" = "TODO_REPO_URL/issues"

[tool.hatch.build.targets.wheel]
packages = ["candidatador"]

[tool.uv.sources]
candidatador-core = { workspace = true }
