<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="moonlighter scans, scores and drafts; only you paste and send the application to the employer, whose reply comes back matched by alias">
  <rect x="0" y="0" width="880" height="250" fill="{{ground}}"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="{{fg}}"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="{{accent}}"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="{{fg}}" text-anchor="middle">
    <rect x="20" y="30" width="520" height="130" rx="10" fill="none" stroke="{{muted}}" stroke-dasharray="5 4"/>
    <text x="280" y="22" fill="{{fg}}">moonlighter · runs locally, calls your LLM</text>
    <rect x="40" y="70" width="130" height="50" rx="6" fill="none" stroke="{{fg}}"/><text x="105" y="100">scan boards</text>
    <rect x="210" y="70" width="130" height="50" rx="6" fill="none" stroke="{{fg}}"/><text x="275" y="100">score fit</text>
    <rect x="380" y="70" width="140" height="50" rx="6" fill="none" stroke="{{fg}}"/><text x="450" y="100">draft sheet</text>
    <line x1="170" y1="95" x2="208" y2="95" stroke="{{fg}}" marker-end="url(#a)"/>
    <line x1="340" y1="95" x2="378" y2="95" stroke="{{fg}}" marker-end="url(#a)"/>
    <rect x="600" y="70" width="100" height="50" rx="25" fill="none" stroke="{{accent}}" stroke-width="2"/><text x="650" y="100">you</text>
    <line x1="520" y1="95" x2="598" y2="95" stroke="{{fg}}" marker-end="url(#a)"/><text x="569" y="86" font-size="11">review</text>
    <rect x="750" y="70" width="110" height="50" rx="6" fill="none" stroke="{{fg}}"/><text x="805" y="92">employer</text><text x="805" y="108" font-size="11">ATS</text>
    <line x1="700" y1="95" x2="748" y2="95" stroke="{{accent}}" stroke-width="2.5" marker-end="url(#h)"/>
    <text x="724" y="62" font-size="11" fill="{{fg}}">you paste</text><text x="724" y="75" font-size="11" fill="{{fg}}">+ send</text>
    <path d="M805 120 V200 H450 V122" fill="none" stroke="{{fg}}" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="628" y="220" font-size="11">reply matched by +alias (Gmail)</text>
  </g>
</svg>
