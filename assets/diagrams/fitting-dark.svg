<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Each moonlighter package works alone; installing two adds commands between them">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EEF1F6"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#EEF1F6" text-anchor="middle">
    <rect x="30" y="40" width="170" height="56" rx="6" fill="none" stroke="#EEF1F6"/><text x="115" y="64">moonlighter-scan</text><text x="115" y="82" font-size="11">find + score</text>
    <rect x="250" y="40" width="170" height="56" rx="6" fill="none" stroke="#EEF1F6"/><text x="335" y="64">moonlighter-apply</text><text x="335" y="82" font-size="11">draft sheet</text>
    <rect x="470" y="40" width="170" height="56" rx="6" fill="none" stroke="#EEF1F6"/><text x="555" y="64">moonlighter-email</text><text x="555" y="82" font-size="11">track replies</text>
    <rect x="690" y="40" width="170" height="56" rx="6" fill="none" stroke="#EEF1F6"/><text x="775" y="64">moonlighter</text><text x="775" y="82" font-size="11">all + MCP server</text>
    <path d="M115 96 V150 H315 V98" fill="none" stroke="#EEF1F6" marker-end="url(#a)"/>
    <text x="215" y="168" font-size="11">scan → pick by score → prepare</text>
    <path d="M355 96 V200 H555 V98" fill="none" stroke="#EEF1F6" marker-end="url(#a)"/>
    <text x="455" y="218" font-size="11">the +alias a sheet mints is what sync matches</text>
    <path d="M30 96 V235 H640 V96" fill="none" stroke="#EEF1F6"/>
    <path d="M640 235 H775 V98" fill="none" stroke="#EEF1F6" marker-end="url(#a)"/>
    <text x="745" y="253" font-size="11">installs the three + moonlighter-core</text>
    <text x="440" y="285" font-size="11" fill="#9AA8C4">same JSON output whatever you install — combinations add commands, never dialects</text>
  </g>
</svg>
